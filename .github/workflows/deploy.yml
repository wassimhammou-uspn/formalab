name: Deploy to GitHub Pages

on:
  push:
    branches: ["host"] # Ou "master" si votre branche principale s'appelle master

# Donne les permissions à GitHub pour déployer
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Étape de construction (Build)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Version de Node.js
          cache: 'npm'
      - name: Install dependencies
        run: npm ci # Installe les dépendances proprement
      - name: Build
        run: npm run build # Lance la compilation
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ⚠️ IMPORTANT : Mettez 'dist' pour Vite ou 'build' pour React/CRA
          path: ./dist

  # Étape de déploiement
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4